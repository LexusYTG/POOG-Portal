<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POOG Store - J2ME Android Ports</title>
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-panel: #161b22;
            --bg-card: #21262d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --primary: #58a6ff;
            --accent: #238636;
            --border: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- Sidebar --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar h2 { font-size: 1.2rem; margin-bottom: 15px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        
        .vendor-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 15px;
            margin-bottom: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .vendor-btn:hover, .vendor-btn.active {
            background-color: var(--bg-card);
            color: var(--primary);
            font-weight: bold;
        }

        /* --- Main Content --- */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .top-bar {
            padding: 20px;
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border);
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-panel);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus { border-color: var(--primary); }

        .catalog {
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            align-content: start;
        }

        /* --- Cards --- */
        .game-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border-color: var(--text-muted);
        }

        .game-title { font-size: 1.3rem; color: #fff; margin-bottom: 5px; }
        .game-vendor { font-size: 0.9rem; color: var(--primary); margin-bottom: 15px; font-weight: bold; }
        .game-details { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .game-details span { display: block; margin-bottom: 3px; }

        .btn-download {
            display: block;
            text-align: center;
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-download:hover { background-color: #2ea043; }

        /* --- Mobile Responsive --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; white-space: nowrap; padding: 10px; }
            .sidebar h2 { display: none; }
            .vendor-btn { display: inline-block; width: auto; margin-right: 5px; margin-bottom: 0; }
            .catalog { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Vendors</h2>
        <div id="vendor-list">
            <!-- Los botones se generan con JS -->
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="top-bar">
            <input type="text" id="search-input" class="search-input" placeholder="🔍 Search games by name...">
        </div>
        <div class="catalog" id="catalog">
            <!-- Las tarjetas se generan con JS -->
        </div>
    </div>

    <script>
        // Base de datos de los juegos (Fácil de actualizar)
        const games = [
            { id: "1", title: "Diamond Rush", vendor: "Gameloft", year: "2006", platform: "J2ME", url: "https://gitflic.ru/project/lexusytg/poog/blob/raw?file=1-Diamond-Rush/release/Diamond-Rush-debug.apk&inline=false" },
            { id: "2", title: "Rally 3D", vendor: "Nokia", year: "2006", platform: "J2ME / M3G", url: "https://gitflic.ru/project/lexusytg/poog/blob/raw?file=2-Rally-3D/release/Rally-3D-debug.apk&inline=false" },
            { id: "3", title: "Tower Bloxx: My City", vendor: "Digital Chocolate", year: "2006", platform: "J2ME", url: "https://gitflic.ru/project/lexusytg/poog/blob/raw?file=3-Tower-Bloxx-My-City/release/Tower-Bloxx-My-City-debug.apk&inline=false" },
            { id: "4", title: "Crazy Penguin Catapult", vendor: "Connect2Media", year: "2008", platform: "J2ME", url: "https://gitflic.ru/project/lexusytg/poog/blob/raw?file=4-Crazy-Penguim-Catapult/release/Crazy-Penguim-Catapult-debug.apk&inline=false" },
            { id: "5", title: "Bounce Tales", vendor: "Rovio Mobile", year: "2008", platform: "J2ME", url: "https://gitflic.ru/project/lexusytg/poog/blob/raw?file=5-Bounce-Tales/release/Bounce-Tales-debug.apk&inline=false" }
        ];

        let currentVendor = "All";
        let currentSearch = "";

        // Referencias al DOM
        const vendorList = document.getElementById("vendor-list");
        const catalog = document.getElementById("catalog");
        const searchInput = document.getElementById("search-input");

        // Función para inicializar los vendors en el menú lateral
        function initVendors() {
            const vendors = ["All", ...new Set(games.map(g => g.vendor))];
            
            vendors.forEach(vendor => {
                const btn = document.createElement("button");
                btn.className = `vendor-btn ${vendor === currentVendor ? 'active' : ''}`;
                btn.textContent = vendor;
                btn.onclick = () => {
                    currentVendor = vendor;
                    updateUI();
                };
                vendorList.appendChild(btn);
            });
        }

        // Función para renderizar las tarjetas de juegos
        function renderGames() {
            catalog.innerHTML = "";
            
            const filteredGames = games.filter(game => {
                const matchesVendor = currentVendor === "All" || game.vendor === currentVendor;
                const matchesSearch = game.title.toLowerCase().includes(currentSearch.toLowerCase());
                return matchesVendor && matchesSearch;
            });

            if (filteredGames.length === 0) {
                catalog.innerHTML = `<p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; margin-top: 50px;">No games found.</p>`;
                return;
            }

            filteredGames.forEach(game => {
                const card = document.createElement("div");
                card.className = "game-card";
                card.innerHTML = `
                    <div>
                        <div class="game-title">${game.title}</div>
                        <div class="game-vendor">${game.vendor}</div>
                        <div class="game-details">
                            <span><strong>Year:</strong> ${game.year}</span>
                            <span><strong>Platform:</strong> ${game.platform}</span>
                            <span><strong>Status:</strong> Native Android Port</span>
                        </div>
                    </div>
                    <a href="${game.url}" target="_blank" class="btn-download">📥 Download APK</a>
                `;
                catalog.appendChild(card);
            });
        }

        // Función para actualizar toda la interfaz
        function updateUI() {
            // Actualizar clase activa en el menú
            Array.from(vendorList.children).forEach(btn => {
                btn.classList.toggle("active", btn.textContent === currentVendor);
            });
            renderGames();
        }

        // Event listeners
        searchInput.addEventListener("input", (e) => {
            currentSearch = e.target.value;
            renderGames();
        });

        // Iniciar
        initVendors();
        renderGames();
    </script>
</body>
</html>
